name: Signed Android release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality:
    name: Full release quality gate
    uses: ./.github/workflows/android-quality.yml
    with:
      api-levels: '[24,34,36]'

  release:
    name: Sign, verify and publish
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      YANJI_RELEASE_KEYSTORE_BASE64: ${{ secrets.YANJI_RELEASE_KEYSTORE_BASE64 }}
      YANJI_SIGNING_STORE_PASSWORD: ${{ secrets.YANJI_SIGNING_STORE_PASSWORD }}
      YANJI_SIGNING_KEY_ALIAS: ${{ secrets.YANJI_SIGNING_KEY_ALIAS }}
      YANJI_SIGNING_KEY_PASSWORD: ${{ secrets.YANJI_SIGNING_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0

      - name: Verify tag, version and signing secrets
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$version_name" || { echo '::error::Unable to read versionName'; exit 1; }
          test "v$version_name" = "$GITHUB_REF_NAME" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$version_name"
            exit 1
          }
          missing=0
          for variable_name in \
            YANJI_RELEASE_KEYSTORE_BASE64 \
            YANJI_SIGNING_STORE_PASSWORD \
            YANJI_SIGNING_KEY_ALIAS \
            YANJI_SIGNING_KEY_PASSWORD; do
            if test -z "${!variable_name:-}"; then
              echo "::error::$variable_name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Materialize ephemeral production keystore
        shell: bash
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/yanji-release.jks"
          umask 077
          printf '%s' "$YANJI_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "YANJI_SIGNING_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Normalize CI-only project settings
        shell: bash
        run: |
          sed -i 's/-Dfile.encoding=GBK/-Dfile.encoding=UTF-8/' gradle.properties
          rm -f local.properties

      - name: Build signed release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature and prepare traceable artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_apk='app/build/outputs/apk/release/app-release.apk'
          test -s "$source_apk"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"
          "$apksigner_path" verify --verbose --print-certs "$source_apk"

          short_sha="${GITHUB_SHA:0:12}"
          artifact_dir="$RUNNER_TEMP/yanji-release-artifacts"
          mkdir -p "$artifact_dir"
          artifact_name="yanji-${GITHUB_REF_NAME}-${short_sha}.apk"
          cp "$source_apk" "$artifact_dir/$artifact_name"
          (
            cd "$artifact_dir"
            sha256sum "$artifact_name" > "$artifact_name.sha256"
          )
          {
            echo "tag=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "artifact=$artifact_name"
            echo "built_at_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            cat "$artifact_dir/$artifact_name.sha256"
          } > "$artifact_dir/$artifact_name.provenance.txt"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Publish immutable GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir='${{ steps.artifacts.outputs.artifact_dir }}'
          artifact_name='${{ steps.artifacts.outputs.artifact_name }}'
          gh release create "$GITHUB_REF_NAME" \
            "$artifact_dir/$artifact_name" \
            "$artifact_dir/$artifact_name.sha256" \
            "$artifact_dir/$artifact_name.provenance.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Yanji $GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove ephemeral signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/yanji-release.jks"
