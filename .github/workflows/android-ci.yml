name: Android CI

# 最低质量门禁：单元测试 + 迁移测试 + debug 打包 + release R8 打包。
# 任何一步失败都不允许合并。
#
# 尚未纳入（见 开发手册/架构与能力状态.md「剩余工作清单」）：
#   - Kover/JaCoCo 覆盖率门禁
#   - Detekt/Ktlint 静态检查
#   - API 24/28/33/36 完整模拟器矩阵（当前只跑 API 34 一档）

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties 里的 -Dfile.encoding=GBK 是「中文 Windows 路径」的 workaround。
      # CI 运行在 UTF-8 的 Linux 上，必须换回 UTF-8，否则 Gson/Gradle 写类路径 argfile 会出问题。
      - name: Use UTF-8 encoding on CI
        run: sed -i 's/-Dfile.encoding=GBK/-Dfile.encoding=UTF-8/' gradle.properties

      # local.properties 指向开发机的 Windows SDK 路径，绝不能带到 CI。
      - name: Drop machine-local SDK path
        run: rm -f local.properties

      - name: Unit tests (含数据库迁移测试)
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release (R8 minify + resource shrink)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Android Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  instrumented:
    name: Instrumented tests (API 34 emulator)
    runs-on: ubuntu-latest
    needs: build

    # ⚠️ 这一段**未在本机验证过**（本机没有 Docker/KVM 环境，只在真机上跑过同一批用例）。
    # 首次推送后请确认这一步的耗时与稳定性；若不想让它阻塞合并，
    # 先把它从 needs 链里摘掉或加 continue-on-error。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use UTF-8 encoding on CI
        run: sed -i 's/-Dfile.encoding=GBK/-Dfile.encoding=UTF-8/' gradle.properties

      - name: Drop machine-local SDK path
        run: rm -f local.properties

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
