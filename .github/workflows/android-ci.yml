name: Android CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Required production baseline
    uses: ./.github/workflows/android-quality.yml
    with:
      api-levels: '[34]'
