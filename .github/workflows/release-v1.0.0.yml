name: Release v1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-v1.0.0.yml'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare CI environment
        run: |
          sed -i 's/-Dfile.encoding=GBK/-Dfile.encoding=UTF-8/' gradle.properties
          rm -f local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk yanji-v1.0.0.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 卷卷 v1.0.0

          首个 GitHub Release，可直接下载 APK 安装使用。

          ### 本版重点
          - 成就系统 V2：59 项成就、6 级稀有度与成长天梯。
          - 优化每日打卡周视图，按周一至周日固定排列并正确对齐今天。
          - 完善学习记录、专注、考试、统计与「卷卷说」等核心学习流程。
          - 持续加强 Local-First 数据架构、Room 数据库迁移与工程质量体系。

          ### 安装说明
          下载下方 `yanji-v1.0.0.apk` 后，在 Android 7.0（API 24）及以上设备安装。
          EOF

          gh release create v1.0.0 yanji-v1.0.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "卷卷 v1.0.0" \
            --notes-file release-notes.md
