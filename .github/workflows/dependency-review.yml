name: Dependency review

on:
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Block new high or critical vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect dependency review availability
        id: availability
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh api --silent \
            "repos/$GITHUB_REPOSITORY/dependency-graph/compare/$BASE_SHA...$HEAD_SHA"; then
            echo 'supported=true' >> "$GITHUB_OUTPUT"
          else
            echo 'supported=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Dependency review skipped: enable Dependency graph in repository security settings.'
          fi

      # Public repositories support this after Dependency graph is enabled. Private forks also
      # require GitHub Advanced Security. The explicit preflight avoids making every PR red when
      # the repository feature is unavailable; it does not suppress actual review findings.
      - name: Review dependency changes
        if: steps.availability.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          license-check: false
