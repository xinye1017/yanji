name: Publish existing APK v1.0.0

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-existing-apk-v1.0.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish APK from verified CI artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from successful main-branch CI build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 34769494675 \
            --repo "$GITHUB_REPOSITORY" \
            --name app-debug \
            --dir dist
          mv dist/app-debug.apk yanji-v1.0.0.apk

      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## 卷卷 v1.0.0

          首个 GitHub Release，可直接下载 APK 安装使用。

          ### 本版重点
          - 成就系统 V2：59 项成就、6 级稀有度与成长天梯。
          - 优化每日打卡周视图，按周一至周日固定排列并正确对齐今天。
          - 完善学习记录、专注、考试、统计与「卷卷说」等核心学习流程。
          - 持续加强 Local-First 数据架构、Room 数据库迁移与工程质量体系。

          ### 安装说明
          下载下方 `yanji-v1.0.0.apk` 后，在 Android 7.0（API 24）及以上设备安装。
          EOF

          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 yanji-v1.0.0.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit v1.0.0 --title "卷卷 v1.0.0" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.0.0 yanji-v1.0.0.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "卷卷 v1.0.0" \
              --notes-file release-notes.md
          fi
