# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# IMPORTANT: file.encoding must stay aligned with the OS ANSI code page (GBK, codepage 936
# on this zh-CN Windows). The Gradle daemon writes the test-worker classpath @argfile in
# this encoding, while the JDK 17 launcher decodes @argfiles using sun.jnu.encoding, which
# the OS derives from that same code page. Any divergence between the two mangles path
# segments and every unit test fails with ClassNotFoundException. Do NOT "fix" this to UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=GBK
# Native builds can otherwise launch one compiler per core for each ABI.
org.gradle.workers.max=2
# Enables Gradle Build Cache.
# See https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enables Gradle Configuration Cache, the preferred Gradle execution mode.
# See https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
# 新架构开关。node_modules 下的 RN 原生库用它决定要不要 apply RNGP、以及把
# BuildConfig.IS_NEW_ARCHITECTURE_ENABLED 设成什么：safe-area-context / svg 都是
# `if (isNewArchitectureEnabled()) apply plugin: "com.facebook.react"`，而这个值同时是
# SafeAreaContextPackage 注册 ReactModuleInfo 时 isTurboModule 的取值。
# 缺了它，这些模块在 Bridgeless 下既不是 TurboModule 也拿不到 legacy interop，
// 运行期报 "Unable to create module"。研迹全程跑 Bridgeless，所以必须显式为 true。
newArchEnabled=true
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
android.overridePathCheck=true
# 原生 ABI 收敛。只编译 arm64-v8a（真机 PKB110）与 x86_64（模拟器）。
# 不设此项时 RN 默认编 4 个 ABI（arm64-v8a / armeabi-v7a / x86 / x86_64），
# 而本工程的 reanimated / react-native-worklets 是以「源码工程」引入的
# （settings.gradle.kts 里 projectDir 指向 node_modules/<pkg>/android），
# 它们的 NDK/CMake 产物直接落在包目录内：每个 ABI 一份 .cxx + 一份 .so，
# 四个 ABI 同时编，node_modules 与 app 的构建产物会成倍膨胀
# （实测曾把本目录撑到 22G，其中 8.7G 是这两个库的 build/ + .cxx）。
# 若将来确需 32 位设备（armeabi-v7a），在下方列表补上即可。
reactNativeArchitectures=arm64-v8a,x86_64

# No proxy settings here on purpose. A machine-local proxy belongs in
# ~/.gradle/gradle.properties: committing one routes every plugin and dependency
# resolution through a host that only exists on that machine, so the build fails
# on CI and on every other checkout before a single task runs.
