[versions]
androidGradlePlugin = "9.0.1"
androidxCore = "1.18.0"
androidxSplashscreen = "1.2.0"
androidxLifecycle = "2.10.0"
androidxActivity = "1.13.0"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.10.2"
# 与 Kotlin 2.3.20 的 serialization 编译器插件配套（navigation3 移除后仍直接依赖此坐标）
kotlinxSerialization = "1.8.1"
# 本地 JVM 单测里的 org.json：Android SDK 提供的只是 stub（方法一调用就抛 not mocked），
# 测试类路径需要真实实现才能覆盖 JSON 解析逻辑。只作用于 testImplementation，不进 APK。
orgJson = "20240303"
junit = "4.13.2"
kotlin = "2.3.20"
ksp = "2.3.11"
room = "2.8.4"
desugarJdkLibs = "2.1.5"
androidxBenchmark = "1.5.0"
androidxUiAutomator = "2.3.0"
androidxProfileInstaller = "1.4.1"
androidxBaselineProfile = "1.5.0-rc02"
reactAndroid = "0.87.1"
hermesVersion = "250829098.0.17"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
# 备份 JSON 导出/导入需要 Json 运行时（@Serializable 注解由 core 提供，已在 classpath 上）
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing-jvm = { module = "androidx.room:room-testing-jvm", version.ref = "room" }
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version = "2.6.2" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
androidx-benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "androidxBenchmark" }
androidx-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "androidxUiAutomator" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "androidxProfileInstaller" }
react-android = { module = "com.facebook.react:react-android", version.ref = "reactAndroid" }
hermes-android = { module = "com.facebook.hermes:hermes-android", version.ref = "hermesVersion" }
fbjni = { module = "com.facebook.fbjni:fbjni", version = "0.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "androidxBaselineProfile" }
